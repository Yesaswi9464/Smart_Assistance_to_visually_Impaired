<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe Steps</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, Arial;
}

body{
background:#dfe3e7;
text-align:center;
}

/* HEADER */

header{
background:#154563;
color:white;
padding:40px 20px;
}

header h1{
font-size:34px;
}

header p{
opacity:0.9;
margin-top:8px;
}

/* MAIN CARD */

.card{
background:#f5f7f9;
max-width:520px;
margin:40px auto;
padding:30px;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,0.15);
}

/* FEATURE BOXES */

.feature{
background:#f0f3f6;
border-radius:12px;
padding:18px;
margin-bottom:18px;
text-align:left;
border:1px solid #d9dee4;
cursor:pointer;
transition:0.2s;
}

.feature:hover{
background:#e7edf2;
}

.feature h3{
color:#1d3f5a;
font-size:20px;
margin-bottom:4px;
}

.feature p{
font-size:14px;
color:#666;
}

/* BUTTON */

.voice-btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#174463;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

/* SOS */

.sos{
position:fixed;
bottom:25px;
right:25px;
width:90px;
height:90px;
border-radius:50%;
background:#d32f2f;
color:white;
font-size:22px;
border:none;
box-shadow:0 10px 25px rgba(211,47,47,0.6);
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Safe Steps</h1>
<p>Assistive walking & navigation system</p>
</header>

<div class="card">

<div class="feature">
<h3>Live Object Detection</h3>
<p>Real-time environment awareness</p>
</div>

<div class="feature">
<h3>Navigation Aid</h3>
<p>Voice-guided safe routes</p>
</div>

<div class="feature">
<h3>Document Reader</h3>
<p>OCR with audio output</p>
</div>

<div class="feature">
<h3>AI Assistant</h3>
<p>Ask questions by voice</p>
</div>

<button class="voice-btn">🎤 Voice Control</button>

</div>

<button class="sos">SOS</button>

</body>
</html>
