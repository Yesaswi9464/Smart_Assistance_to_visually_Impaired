<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SafeSteps</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- AI Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial;
background:#f4f6f8;
text-align:center;
}

header{
background:#0b3c5d;
color:white;
padding:20px;
}

.card{
background:white;
max-width:650px;
margin:30px auto;
padding:25px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:10px;
background:#0b3c5d;
color:white;
font-size:18px;
cursor:pointer;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

video,canvas{
width:100%;
margin-top:12px;
border-radius:10px;
}

.page{
display:none;
}

.active{
display:block;
}

.sos{
position:fixed;
bottom:20px;
right:20px;
width:80px;
height:80px;
border-radius:50%;
background:#c62828;
font-size:22px;
}

</style>
</head>

<body>

<header>
<h1>SafeSteps</h1>
<p>Assistive Navigation System</p>
</header>

<!-- LOGIN -->

<div id="login" class="card page active">

<h2>Login</h2>

<input id="loginEmail" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p>No account? <a href="#" onclick="showPage('register')">Register</a></p>

<p id="loginError"></p>

</div>

<!-- REGISTER -->

<div id="register" class="card page">

<h2>Register</h2>

<input id="regName" placeholder="Name">
<input id="regEmail" placeholder="Email">
<input id="regPass" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="showPage('login')">Back</button>

</div>

<!-- HOME -->

<div id="home" class="card page">

<h2>Main Menu</h2>

<button onclick="showPage('live')">Live Object Detection</button>

<button onclick="showPage('nav')">Navigation</button>

<button onclick="showPage('reader')">Document Reader</button>

<button onclick="startVoice()">Voice Command</button>

<button onclick="showPage('settings')">Settings</button>

</div>

<!-- LIVE DETECTION -->

<div id="live" class="card page">

<h2>Live Detection</h2>

<video id="video" autoplay muted></video>

<canvas id="canvas"></canvas>

<button onclick="describeScene()">Describe Scene</button>

<button onclick="showPage('home')">Back</button>

</div>

<!-- NAVIGATION -->

<div id="nav" class="card page">

<h2>Navigation</h2>

<input id="destination" placeholder="Destination">

<button onclick="startNavigation()">Start Navigation</button>

<button onclick="voiceNavigation()">Speak Destination</button>

<button onclick="showPage('home')">Back</button>

</div>

<!-- OCR -->

<div id="reader" class="card page">

<h2>Document Reader</h2>

<input type="file" id="imageInput">

<textarea id="ocrText" placeholder="Detected text"></textarea>

<button onclick="showPage('home')">Back</button>

</div>

<!-- SETTINGS -->

<div id="settings" class="card page">

<h2>Settings</h2>

<input id="emergencyPhone" placeholder="Emergency Phone">

<label>
<input type="checkbox" id="darkMode"> Dark Mode
</label>

<button onclick="saveSettings()">Save Settings</button>

<button onclick="showPage('home')">Back</button>

</div>

<button class="sos" onclick="sendSOS()">SOS</button>

<script>

/* PAGE SWITCH */

function showPage(page){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active")
})

document.getElementById(page).classList.add("active")

}

/* REGISTER */

function register(){

const user={
name:regName.value,
email:regEmail.value,
password:regPass.value
}

localStorage.setItem("user",JSON.stringify(user))

alert("Registered successfully")

showPage("login")

}

/* LOGIN */

function login(){

const user=JSON.parse(localStorage.getItem("user"))

if(!user){
loginError.innerText="No user found"
return
}

if(loginEmail.value===user.email && loginPass.value===user.password){
showPage("home")
}else{
loginError.innerText="Invalid login"
}

}

/* SPEECH */

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
const recognition = new SpeechRecognition()

function speak(text){
speechSynthesis.cancel()
speechSynthesis.speak(new SpeechSynthesisUtterance(text))
}

/* VOICE COMMAND */

function startVoice(){

recognition.start()

speak("Listening")

}

recognition.onresult=(event)=>{

let cmd=event.results[0][0].transcript.toLowerCase()

if(cmd.includes("live")) showPage("live")

if(cmd.includes("navigation")) showPage("nav")

if(cmd.includes("read")) showPage("reader")

}

/* CAMERA + OBJECT DETECTION */

const video=document.getElementById("video")
const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")

let model

async function startCamera(){

const stream=await navigator.mediaDevices.getUserMedia({video:true})

video.srcObject=stream

}

async function loadModel(){

model=await cocoSsd.load()

detect()

}

async function detect(){

if(!model) return

const predictions=await model.detect(video)

canvas.width=video.videoWidth
canvas.height=video.videoHeight

ctx.clearRect(0,0,canvas.width,canvas.height)

predictions.forEach(p=>{

if(p.score>0.6){

const [x,y,w,h]=p.bbox

ctx.strokeStyle="red"
ctx.strokeRect(x,y,w,h)

ctx.fillText(p.class,x,y)

}

})

requestAnimationFrame(detect)

}

function describeScene(){

model.detect(video).then(p=>{

let objects=p.map(o=>o.class).join(", ")

speak("I see " + objects)

})

}

startCamera()
loadModel()

/* NAVIGATION */

function startNavigation(){

navigator.geolocation.getCurrentPosition(pos=>{

let lat=pos.coords.latitude
let lon=pos.coords.longitude
let dest=destination.value

window.open(
`https://www.google.com/maps/dir/?api=1&origin=${lat},${lon}&destination=${dest}&travelmode=walking`
)

})

}

function voiceNavigation(){

recognition.start()

speak("Say destination")

recognition.onresult=(event)=>{

destination.value=event.results[0][0].transcript

startNavigation()

}

}

/* OCR */

imageInput.addEventListener("change",(e)=>{

const file=e.target.files[0]

Tesseract.recognize(file,"eng").then(result=>{

ocrText.value=result.data.text

speak(result.data.text)

})

})

/* SOS */

function sendSOS(){

let phone=localStorage.getItem("emergencyPhone") || "9999999999"

window.open(`https://wa.me/${phone}?text=Emergency help needed`)

speak("Emergency message sent")

}

/* SETTINGS */

function saveSettings(){

localStorage.setItem("emergencyPhone", emergencyPhone.value)

if(darkMode.checked){

document.body.style.background="#121212"
document.body.style.color="white"

}

alert("Settings saved")

}

</script>

</body>
</html>
